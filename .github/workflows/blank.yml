name: WakaTime Double Stats Tracker

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Profile README Sections
    runs-on: ubuntu-latest
    steps:
      # Step 1: Inject Cumulative Lifetime Data
      - name: Generate Lifetime Metrics
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIME_RANGE: "all_time"
          SECTION_NAME: "waka-all-time"
          IGNORED_LANGUAGES: "JSON, jsonc, YAML, Other, Text, Markdown"
          SHOW_TIME: true
          SHOW_TOTAL: true

      # Step 2: Inject Filtered Weekly Language Metrics
      - name: Generate Weekly Breakdown
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIME_RANGE: "last_7_days"
          SECTION_NAME: "waka-weekly"
          IGNORED_LANGUAGES: "JSON, jsonc, YAML, Other, Text, Markdown"
          SHOW_TIME: true
          SHOW_TOTAL: false
